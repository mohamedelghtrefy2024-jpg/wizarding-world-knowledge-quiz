<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعلان - د. أسامة مجدي سالم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0; padding:0; background:transparent; font-family:'Cairo',sans-serif;}
  .banner-wrap{
    display:flex; align-items:center; justify-content:center;
    padding:20px; background:#0a1120;
  }
  .banner{
    display:flex; align-items:stretch;
    width:340px; max-width:100%; height:104px;
    border-radius:14px; overflow:hidden;
    text-decoration:none;
    box-shadow:0 10px 26px rgba(0,0,0,.4);
    border:1px solid rgba(34,211,238,.25);
    background:#0c1c33;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .banner:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(34,211,238,.18);}
  .banner-photo{
    width:88px; flex-shrink:0; overflow:hidden;
  }
  .banner-photo img{
    width:100%; height:100%; object-fit:cover; object-position:top center; display:block;
  }
  .banner-body{
    flex:1; padding:10px 14px; display:flex; flex-direction:column; justify-content:center;
    text-align:right; min-width:0;
  }
  .banner-eyebrow{
    font-size:10px; font-weight:700; color:#22d3ee; margin-bottom:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .banner-title{
    font-size:14px; font-weight:800; color:#eef3f8; margin-bottom:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .banner-sub{
    font-size:11px; color:#93a3b8; margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .banner-cta{
    display:inline-flex; align-items:center; gap:4px; align-self:flex-start;
    background:linear-gradient(135deg,#f5a623,#e08b0a);
    color:#1a1204; font-weight:800; font-size:11px;
    padding:5px 10px; border-radius:7px;
  }
</style>
</head>
<body>
<div class="banner-wrap">
  <a class="banner" href="https://mohamedelghtrefy2024-jpg.github.io/Landing_Pages2026/" target="_blank" rel="noopener">
    <div class="banner-photo">
      <img src="banner-photo.jpg" alt="د. أسامة مجدي سالم">
    </div>
    <div class="banner-body">
      <div class="banner-eyebrow">جراحة المخ والأعصاب</div>
      <div class="banner-title">د. أسامة مجدي سالم</div>
      <div class="banner-sub">دقة جراحية… وراحة إنسانية</div>
      <span class="banner-cta">احجز الآن ←</span>
    </div>
  </a>
</div>
</body>
</html>
